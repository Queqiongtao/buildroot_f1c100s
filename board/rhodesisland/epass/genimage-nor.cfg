flash nor-16M {
	pebsize = 64K
	numpebs = 256
	minimum-io-unit-size = 256
}

image sysimage-nor.img {
	flash {}
	flashtype = "nor-16M"

	partition u-boot {
		image = "u-boot-sunxi-with-spl.bin"
		size = 512K
	}

	partition dtbs {
		offset = 512K
		image = "dtbs.itb"
		size = 512K
	}

	partition kernel {
		offset = 1024K
		image = "kernel.itb"
		size = 3840K
	}

	partition rootfs {
		offset = 4864K
		image = "rootfs.squashfs"
		size = 11008K
	}

	partition data {
		offset = 15872K
		image = "data.img"
		size = 512K
	}
}
